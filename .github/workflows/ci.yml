# CI gate for every push to main and every pull request.
# Jobs run in parallel; all must pass before merging.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo:
    name: Formatting and commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Prettier
        run: npm run format:check
      - name: Conventional Commits (pull requests)
        if: github.event_name == 'pull_request'
        run: >
          npx commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: civicfix
          POSTGRES_PASSWORD: civicfix
          POSTGRES_DB: civicfix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civicfix -d civicfix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://civicfix:civicfix@localhost:5432/civicfix
      DATABASE_URL_UNPOOLED: postgresql://civicfix:civicfix@localhost:5432/civicfix
      SHADOW_DATABASE_URL: postgresql://civicfix:civicfix@localhost:5432/civicfix_shadow
      # CI-only value; never used outside this ephemeral job.
      JWT_ACCESS_SECRET: ci-only-jwt-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # npm ci also generates the Prisma client (postinstall).
      - run: npm ci
      - run: npx prisma validate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: OpenAPI document is up to date
        run: npm run openapi:check
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Schema matches migrations (drift check)
        run: |
          # Prisma 7: the CLI connects via prisma.config.ts (DATABASE_URL_UNPOOLED
          # and SHADOW_DATABASE_URL from the job env).
          echo 'CREATE DATABASE civicfix_shadow;' | npx prisma db execute --stdin
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: API image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build backend image (same Dockerfile Fly deploys)
        run: docker build --pull -t civicfix-api:ci backend
