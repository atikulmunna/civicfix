# fly.toml app configuration file generated for civicfix-api on 2026-07-05T19:15:44+06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'civicfix-api'
primary_region = 'sin'
# Graceful shutdown (src/lib/shutdown.ts): the API drains in-flight requests
# on SIGTERM and exits within 8 s, inside this 10 s window.
kill_signal = 'SIGTERM'
kill_timeout = '10s'

[build]

# Apply pending database migrations, then recompute triage (F1: trust scores
# and priority anchors), before the new version takes traffic. Runs once per
# deploy in a temporary machine with the new image and the app's secrets
# (Prisma Migrate uses DATABASE_URL_UNPOOLED, the direct connection). A failed
# step stops the deploy, so old code never meets a new schema half-applied.
# `npm run release` is defined in package.json.
[deploy]
  release_command = 'npm run release'

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  # Fly's edge proxy sits in front of the app: trust exactly one
  # X-Forwarded-For hop (see backend/src/lib/client-ip.ts).
  TRUST_PROXY_HOPS = '1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
