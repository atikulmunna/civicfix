# Fly.io config for the CivicFix backend API.
# First deploy:  cd backend && fly launch --no-deploy --copy-config
# (or `fly apps create civicfix-api` then `fly deploy`). Set secrets before deploy:
#   fly secrets set DATABASE_URL="<supabase-uri>" \
#                   JWT_ACCESS_SECRET="<long-random-string>" \
#                   CORS_ORIGIN="https://<your-app>.vercel.app"
app = "civicfix-api"
primary_region = "sin" # Singapore — nearest to South Asia. Run `fly platform regions` to change.

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine always on — no cold starts (the reason for choosing Fly).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
